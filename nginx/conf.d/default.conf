map $http_upgrade $smokey_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 6m;

    # Optional dev service uses runtime DNS resolution so an absent module cannot stop PixelCore.
    location /smokey-assets/dev/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $smokey_dev smokey-ui:5174;
        proxy_pass http://$smokey_dev;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smokey_connection_upgrade;
        proxy_buffering off;
    }

    location /smokey-assets/channels/ {
        alias /smokey-ui/channels/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /smokey-assets/releases/ {
        alias /smokey-ui/releases/;
        types {
            application/javascript js mjs;
            text/css css;
            application/json json;
            font/woff2 woff2;
            image/webp webp;
            image/png png;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
