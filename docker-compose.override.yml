services:
  frontend:
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_SMOKEY_UI_MODE: ${NUXT_PUBLIC_SMOKEY_UI_MODE:-module}
      NUXT_PUBLIC_SMOKEY_UI_SOURCE: ${NUXT_PUBLIC_SMOKEY_UI_SOURCE:-development}

  backend:
    environment:
      DJANGO_DEBUG: "True"

  worker:
    environment:
      DJANGO_DEBUG: "True"

  beat:
    environment:
      DJANGO_DEBUG: "True"

  nginx:
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/

networks:
  pixelcore:
    driver: bridge
