services:
  frontend:
    build:
      context: ./pixelcore-frontend
      additional_contexts:
        website-builder: ../website-builder
    ports:
      - "3001:3000"
    volumes:
      - ./pixelcore-frontend:/workspace/pixelcore-platform/pixelcore-frontend
      - ../website-builder:/workspace/website-builder:ro
      - frontend-node-modules:/workspace/pixelcore-platform/pixelcore-frontend/node_modules
      - frontend-nuxt:/workspace/pixelcore-platform/pixelcore-frontend/.nuxt
    working_dir: /workspace/pixelcore-platform/pixelcore-frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/api/}
      NUXT_API_INTERNAL_BASE_URL: ${NUXT_API_INTERNAL_BASE_URL:-http://backend:8000/api/}
      NUXT_PUBLIC_PLATFORM_DOMAIN: ${PIXELCORE_PLATFORM_DOMAIN:-pixelcore.localhost}
      NUXT_PUBLIC_GOOGLE_IDENTITY_CLIENT_ID: ${NUXT_PUBLIC_GOOGLE_IDENTITY_CLIENT_ID:-}
      NUXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NUXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    networks:
      - pixelcore

  backend:
    build:
      context: ./pixelcore-backend
      additional_contexts:
        website-builder: ../website-builder
    command: ./command.sh
    ports:
      - "8000:8000"
    volumes:
      - ./pixelcore-backend:/app
      - ../website-builder:/website-builder:ro
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-pixelcore}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-pixelcore}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3001}
      PIXELCORE_FRONTEND_URL: ${PIXELCORE_FRONTEND_URL:-http://localhost:3001}
      PIXELCORE_PUBLIC_API_URL: ${PIXELCORE_PUBLIC_API_URL:-http://localhost:8000/api}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_IDENTITY_CLIENT_ID: ${GOOGLE_IDENTITY_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:8000/api/google-calendar/callback/}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PIXELCORE_CADDY_AUTH_TOKEN: ${PIXELCORE_CADDY_AUTH_TOKEN:-}
      PIXELCORE_PLATFORM_DOMAIN: ${PIXELCORE_PLATFORM_DOMAIN:-pixelcore.localhost}
      PIXELCORE_USE_S3: ${PIXELCORE_USE_S3:-False}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-PixelCore <noreply@pixelcore.local>}
    networks:
      - pixelcore

  worker:
    build:
      context: ./pixelcore-backend
      additional_contexts:
        website-builder: ../website-builder
    command: celery -A pixelcore_backend worker --loglevel=INFO
    volumes:
      - ./pixelcore-backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-pixelcore}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-pixelcore}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PIXELCORE_PUBLIC_API_URL: ${PIXELCORE_PUBLIC_API_URL:-http://localhost:8000/api}
    networks:
      - pixelcore

  beat:
    build:
      context: ./pixelcore-backend
      additional_contexts:
        website-builder: ../website-builder
    command: celery -A pixelcore_backend beat --loglevel=INFO
    volumes:
      - ./pixelcore-backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-pixelcore}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-pixelcore}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    networks:
      - pixelcore

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-pixelcore}
      POSTGRES_USER: ${DJANGO_DB_USER:-pixelcore}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:?Set DJANGO_DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-pixelcore} -d ${DJANGO_DB_NAME:-pixelcore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pixelcore

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pixelcore

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pixelcore

volumes:
  static:
  media:
  pg-data:
  redis-data:
  frontend-node-modules:
  frontend-nuxt:

networks:
  pixelcore:
    driver: bridge
