services:
  frontend:
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:?Set the production API URL}
  backend:
    command: gunicorn pixelcore_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set production hosts}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set production origins}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set production origins}
      PIXELCORE_FRONTEND_URL: ${PIXELCORE_FRONTEND_URL:?Set the production frontend URL}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:?Set the production Google callback}
      PIXELCORE_CADDY_AUTH_TOKEN: ${PIXELCORE_CADDY_AUTH_TOKEN:?Set the Caddy authorization token}
      PIXELCORE_USE_S3: ${PIXELCORE_USE_S3:-True}
  nginx:
    profiles: ["development"]
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PIXELCORE_PLATFORM_DOMAIN: ${PIXELCORE_PLATFORM_DOMAIN:?Set the platform domain}
      PIXELCORE_CADDY_AUTH_TOKEN: ${PIXELCORE_CADDY_AUTH_TOKEN:?Set the Caddy authorization token}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set the ACME contact email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pixelcore

volumes:
  caddy-data:
  caddy-config:
